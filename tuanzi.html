<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>生日快乐 — 满屏飘字（本地 MP3 BGM）</title>
<style>
    :root{
        --max-width: 100vw;
        --max-height: 100vh;
    }
    html,body{
        height:100%;
        margin:0;
        padding:0;
        overflow:hidden;
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Arial", sans-serif;
        -webkit-font-smoothing:antialiased;
        -moz-osx-font-smoothing:grayscale;
        /* 淡粉色背景 */
        background-color: #ffeef3; 
    }

    /* 隐藏音频播放器控件 */
    #background-music {
        display: none;
    }

    .stage{
        position:relative;
        width:100%;
        height:100%;
    }

    .blessing{
        position:absolute;
        white-space:nowrap;
        
        /* 字体样式 */
        font-size: clamp(16px, 3.5vw, 30px); 
        font-weight:700; 
        pointer-events:none;
        user-select:none;
        
        /* 保持水平 */
        transform: rotate(0deg); 
        will-change: opacity;
        opacity:0;
        color: #333; 
        
        /* 圆角矩形白色背景框 */
        background: rgba(255, 255, 255, 0.9); 
        padding: 6px 12px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
    }
    
    /* 动画：原地淡入、保持、淡出 */
    @keyframes fadeInOut {
        0% { opacity:0; }
        15% { opacity:1; }
        85% { opacity:1; }
        100% { opacity:0; }
    }

    .float-anim{
        animation-name: fadeInOut;
        animation-timing-function: ease-in-out;
        animation-fill-mode: forwards;
    }

    .fadeOut{
        transition: opacity 0.8s;
        opacity:0 !important;
    }

    /* 左上角常显文字样式 */
    .top-left-message{
        position:fixed;
        left:16px;
        top:16px;
        z-index:10000;
        font-size: clamp(20px, 4vw, 36px);
        font-weight: bold;
        color:#333; 
        text-shadow: 0 0 1px rgba(255,255,255,0.8);
        padding:8px 12px;
        border-radius:8px;
        user-select: none;
        background: rgba(255, 255, 255, 0.7); 
        border-radius: 12px;
    }

    /* 右下角常显文字样式 */
    .bottom-right-message{
        position:fixed;
        right:16px;
        bottom:16px;
        z-index:10000;
        font-size: clamp(16px, 3.5vw, 28px); 
        font-weight: bold;
        color:#333; 
        text-shadow: 0 0 1px rgba(255,255,255,0.8);
        padding:6px 10px;
        border-radius:8px;
        user-select: none;
        background: rgba(255, 255, 255, 0.7);
        border-radius: 12px;
    }

    /* 响应式调整 */
    @media (max-width:600px){
        .top-left-message{ font-size: clamp(18px, 5vw, 28px); padding:6px 10px; }
        .bottom-right-message{ font-size: clamp(14px, 4vw, 24px); padding:5px 8px; }
    }
</style>
</head>
<body>

<audio id="background-music" autoplay loop>
    <source src="youdiantian.mp3" type="audio/mp3"> 
    Your browser does not support the audio element.
</audio>

<div class="stage" id="stage"></div>

<div class="top-left-message">亲爱的团子，愿你天天开心</div>
<div class="bottom-right-message">来自培森的祝福</div>

<script>
// ====== Config ======
const MESSAGES = [
"生日快乐", "天天开心", "永远长不胖", "最美的女孩",
"好运连连", "心想事成", "幸福久久", "被爱包围",
"元气满满", "永远十八", "可可爱爱", "平安喜乐",
"事事顺心", "甜甜的你", "大女主剧本", "惊喜不断",
"温柔以待", "万事胜意", "自由自在", "光芒万丈",
"岁岁平安", "美梦成真", "保持微笑", "福气满满",
"未来可期", "所愿皆得", "充满希望", "活出精彩",
"闪闪发光", "快乐加倍", "勇敢追梦", "遇见美好",
"岁月静好", "一切顺利", "魅力无限", "充满活力",
"独一无二", "永远炙热", "值得所有", "甜蜜如初",
"前途似锦", "快乐无边", "永远可爱", "优雅自信",
"人间值得", "保持热爱", "闪亮登场", "快乐至上",
"温柔常驻", "青春永驻" 
];

const MAX_ON_STAGE = 50; 
const INTERVAL_MS = 400; 
const ANIM_MIN = 3000;   
const ANIM_MAX = 5000;   

const FONT_COLORS = [
    '#333333','#444444','#555555','#666666'
];

const stage = document.getElementById('stage');
const music = document.getElementById('background-music');

function rand(min,max){ return Math.random()*(max-min)+min; }
function pick(array){ return array[Math.floor(Math.random()*array.length)]; }

function createBlessing(){
    if(stage.children.length >= MAX_ON_STAGE){
        const oldest = stage.children[0];
        oldest.classList.add('fadeOut');
        setTimeout(()=>{ try{ if(oldest.parentNode) oldest.parentNode.removeChild(oldest);}catch(e){} }, 900);
    }

    const text = pick(MESSAGES);
    const el = document.createElement('div');
    el.className = 'blessing float-anim';
    el.textContent = text;

    // 水平定位：覆盖屏幕 5vw 到 90vw 区域
    const minLeft = 5; 
    const maxLeft = 90; 
    const left = rand(minLeft, maxLeft); 

    // 垂直定位：避开常驻文字区域（顶部 15vh，底部 15vh）
    const minTop = 15; 
    const maxTop = 85; 
    const top = rand(minTop, maxTop); 
    
    el.style.left = left + 'vw';
    el.style.top = top + 'vh';

    const fg = pick(FONT_COLORS);
    el.style.color = fg;

    const size = Math.floor(rand(16, 30)); 
    el.style.fontSize = size + 'px';

    const dur = Math.floor(rand(ANIM_MIN, ANIM_MAX));
    el.style.animationDuration = (dur/1000) + 's';

    el.style.zIndex = Math.floor(rand(50, 500));

    stage.appendChild(el);

    setTimeout(()=>{
        try{ if(el.parentNode) el.parentNode.removeChild(el); }catch(e){}
    }, dur+300);
}

let timer = setInterval(createBlessing, INTERVAL_MS);

// 尝试在用户第一次交互（点击或触摸）时播放音乐
document.addEventListener('click', function attemptPlay() {
    music.play().catch(error => {
        // 如果播放失败（通常是权限问题），可以忽略错误
    });
    // 移除事件监听器，只尝试播放一次
    document.removeEventListener('click', attemptPlay);
});

document.addEventListener('visibilitychange', ()=>{
    if(document.hidden){
        clearInterval(timer);
        music.pause(); 
    } else {
        clearInterval(timer);
        timer = setInterval(createBlessing, INTERVAL_MS);
        music.play().catch(error => {}); 
    }
});

// 初始生成数量
for(let i=0;i<15;i++){
    setTimeout(createBlessing, i*150);
}
</script>
</body>
</html>
